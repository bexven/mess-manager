services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXT_PUBLIC_CURRENCY_SYMBOL: ${NEXT_PUBLIC_CURRENCY_SYMBOL:-৳}
      RUN_SEED_ON_START: ${RUN_SEED_ON_START:-false}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Sk Moni}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_SECOND_USER_NAME: ${SEED_SECOND_USER_NAME:-Taufiq Uddin}
      SEED_SECOND_USER_EMAIL: ${SEED_SECOND_USER_EMAIL}
      SEED_SECOND_USER_PASSWORD: ${SEED_SECOND_USER_PASSWORD}
    # Bind to localhost only — the host's Nginx (see nginx/mess-manager.conf)
    # terminates TLS on the public subdomain and proxies here.
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
