# Example host Nginx site config for a subdomain reverse-proxying to the
# app container published on 127.0.0.1:3000 (see docker-compose.yml).
#
# Install on the VPS at /etc/nginx/sites-available/mess-manager.conf and
# symlink into sites-enabled, then obtain a certificate with:
#   sudo certbot --nginx -d mess.yourdomain.com
# (certbot will rewrite the server block to add the ssl_certificate lines
# and a :80 -> :443 redirect automatically).

server {
    listen 80;
    server_name mess.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 10m;
}
